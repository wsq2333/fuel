# OSS 凭证（由 CI/CD 或密钥管理系统注入，禁止提交真实密钥）。
# 创建方式（示例）：
#   kubectl -n fuel-system create secret generic fuel-oss \
#     --from-literal=accessKey=YOUR_AK --from-literal=accessSecret=YOUR_SK
# 环境变量名对应 internal/config.applyEnv: OSS_ACCESS_KEY_ID / OSS_ACCESS_KEY_SECRET。
apiVersion: v1
kind: Secret
metadata:
  name: fuel-oss
  namespace: fuel-system
type: Opaque
stringData:
  accessKey: ""
  accessSecret: ""